<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Realistic Space Simulator Sandbox (RSSS)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    .panel {
      position: absolute;
      background: rgba(12, 14, 24, 0.92);
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 10;
    }
    #ui-controls {
      top: 15px;
      left: 15px;
      width: 290px;
    }
    #inspector-panel {
      top: 15px;
      right: 15px;
      width: 320px;
      display: block;
      max-height: 90vh;
      overflow-y: auto;
    }
    h2, h3 {
      margin: 0 0 12px 0;
      font-size: 1.1rem;
      color: #61afef;
    }
    /* Stylized RSSS logo: R low, S's high, R-arm stretched under the SSS */
    h2.rsss-logo {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.08em;
      color: #61afef;
      text-shadow: 0 0 12px rgba(97, 175, 239, 0.55);
      transform: rotate(-12deg);
      transform-origin: left center;
      display: inline-block;
      margin: 4px 0 18px 2px;
      line-height: 0.85;
      position: relative;
    }
    h2.rsss-logo .r {
      display: inline-block;
      transform: translateY(0.55em) rotate(8deg);
      color: #e5c07b;
      position: relative;
      z-index: 1;
    }
    h2.rsss-logo .r::after {
      content: '';
      position: absolute;
      left: 0.15em;
      bottom: 0.12em;
      width: 2.85em;
      height: 0.14em;
      background: linear-gradient(90deg, #e5c07b 0%, #61afef 70%, transparent 100%);
      border-radius: 2px;
      box-shadow: 0 0 6px rgba(229, 192, 123, 0.6);
    }
    h2.rsss-logo .sss {
      display: inline-block;
      transform: translateY(-0.28em);
      letter-spacing: -0.06em;
    }
    h3 {
      font-size: 0.95rem;
      color: #e5c07b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 5px;
    }
    .control-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      margin-bottom: 4px;
      color: #abb2bf;
    }
    input[type="file"], input[type="range"], input[type="number"], select {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 4px;
      padding: 6px;
    }
    select option {
      background: #0c0e18;
      color: white;
    }
    button {
      background: #4b6cc1;
      border: none;
      color: white;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #3b5499; }
    .btn-spawn {
      background: #98c379;
      color: #000;
    }
    .btn-spawn:hover { background: #7ca85c; }
    .btn-move {
      background: #d19a66;
      color: #000;
    }
    .btn-move.active {
      background: #e5c07b;
      box-shadow: 0 0 10px rgba(229, 192, 123, 0.6);
    }
    .btn-surface {
      background: #c678dd;
      color: #fff;
    }
    .btn-surface:hover { background: #a855c4; }
    .btn-surface.active {
      background: #e06c75;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      margin-bottom: 6px;
    }
    .stat-label { color: #828997; }
    .stat-val { font-weight: bold; color: #98c379; }
    .divider {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin: 12px 0;
    }
    .status-alert {
      color: #e06c75;
      font-weight: bold;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui-controls" class="panel">
    <h2 class="rsss-logo"><span class="r">R</span><span class="sss">SSS</span></h2>
    
    <h3> Spawn Objects</h3>
    <div class="control-group">
      <label for="spawn-type">Object Type:</label>
      <select id="spawn-type">
        <option value="planet" selected>Planet / Gas Giant</option>
        <option value="star">Star (Central Mass)</option>
        <option value="moon">Moon (Attaches to Planet)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="spawn-distance">Distance from Primary Star (AU):</label>
      <input type="number" id="spawn-distance" value="1.0" step="0.1" min="0">
    </div>

    <button id="spawn-btn" class="btn-spawn">Spawn Object</button>

    <div class="divider"></div>

    <div class="control-group">
      <label for="texture-upload">Upload Custom Heightmap:</label>
      <input type="file" id="texture-upload" accept="image/*">
    </div>

    <div class="control-group">
      <label for="cloud-upload">Upload Custom Cloud Texture:</label>
      <input type="file" id="cloud-upload" accept="image/*">
    </div>

    <div class="control-group">
      <label for="sim-speed-input">Sim Speed (Years per Second):</label>
      <input type="number" id="sim-speed-input" value="0.0001" min="0" step="any">
    </div>

    <button id="pause-btn">Pause Simulation</button>
    <button id="reset-cam-btn">Focus Sun</button>
    <button id="clear-btn" style="background: #e06c75;">Clear All Objects</button>
  </div>

  <div id="inspector-panel" class="panel">
    <h3> Object Selection</h3>
    <div class="control-group">
      <label for="active-object-select">Select Active Object:</label>
      <select id="active-object-select"></select>
    </div>

    <button id="move-toggle-btn" class="btn-move">Move Planet</button>
    <button id="surface-view-btn" class="btn-surface">View from Surface</button>
    <button id="city-lights-btn" class="btn-surface" style="margin-top:6px;">Enable City Lights</button>

    <div class="divider"></div>

    <h3>Body Inspector</h3>
    <div class="stat-row">
      <span class="stat-label">Classification:</span>
      <span class="stat-val" id="obj-type">Terrestrial Planet</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Distance to Primary Star:</span>
      <span class="stat-val" id="obj-dist">1.00 AU</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Climate Zone:</span>
      <span class="stat-val" id="obj-zone">Habitable</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Habitability Score:</span>
      <span class="stat-val" id="obj-habitability">100%</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Vegetation Land Coverage:</span>
      <span class="stat-val" id="obj-veg-coverage">0%</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Surface Climate:</span>
      <span class="stat-val" id="obj-climate-progress">Temperate</span>
    </div>

    <div class="divider"></div>
    <h3> Atmosphere & Composition</h3>

    <div class="control-group">
      <label for="atmosphere-type">Atmosphere Air Composition:</label>
      <select id="atmosphere-type">
        <option value="earthlike">Nitrogen / Oxygen (Earth-like)</option>
        <option value="co2">Carbon Dioxide (Venus/Mars-like)</option>
        <option value="methane">Methane / Ammonia (Titan-like)</option>
        <option value="vacuum">Vacuum (No Atmosphere)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="atmosphere-pressure">Atmospheric Pressure: <span id="pressure-val">1.0</span> Bar</label>
      <input type="range" id="atmosphere-pressure" min="0" max="100" step="0.5" value="1.0">
    </div>

    <div class="control-group">
      <label for="water-coverage">Surface Water Level (%):</label>
      <input type="number" id="water-coverage" min="0" max="100" step="0.1" value="56.5">
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label for="mass-input">Modify Mass (Earth Masses):</label>
      <input type="number" id="mass-input" step="0.5" min="0.01">
    </div>
    <button id="apply-mass-btn">Apply Mass Change</button>
    <button id="delete-obj-btn" style="background: #e06c75; margin-top: 8px;">Delete Object</button>
  </div>

  <div id="canvas-container"></div>

  <script>
    const EARTH_RADIUS = 10.0;
    const SUN_RADIUS = 120.0; 
    const MOON_RADIUS = 2.7;
    const MOON_ORBIT_DIST = 120.0;
    
    const AU = 8000.0; 
    const SECONDS_PER_YEAR = 31536000; 
    const DAY_SECONDS = 86400;

    const SUN_MASS = 333000;
    const G = (4 * Math.PI * Math.PI * Math.pow(AU, 3)) / (SUN_MASS * Math.pow(SECONDS_PER_YEAR, 2));

    let defaultGrayscaleImg = new Image();
    // NO crossOrigin — required so local earth.jpeg / cloud.png load from your RSSS folder

    let cloudImg = new Image();
    let cloudImgReady = false;
    let cloudPixelData = null;

    function applyHeightmapToAllBodies() {
      if (typeof celestialBodies === 'undefined') return;
      celestialBodies.forEach(b => {
        if (!b.isStar) {
          b.rebuildHeightmap();
          b.updateTextureAndDeform(true);
        }
      });
    }

    function processCloudImage(img) {
      try {
        const cCanvas = document.createElement('canvas');
        cCanvas.width = 1024;
        cCanvas.height = 512;
        const cCtx = cCanvas.getContext('2d');
        cCtx.clearRect(0, 0, 1024, 512);
        cCtx.drawImage(img, 0, 0, 1024, 512);
        cloudPixelData = cCtx.getImageData(0, 0, 1024, 512);
        cloudImgReady = true;
        if (typeof celestialBodies !== 'undefined') {
          celestialBodies.forEach(b => {
            if (!b.isStar) {
              b.textureDirty = true;
              b.updateTextureAndDeform(true);
            }
          });
        }
        console.log("Cloud texture ready");
      } catch (err) {
        console.warn("Cloud process failed:", err);
        cloudImgReady = false;
        cloudPixelData = null;
      }
    }

    defaultGrayscaleImg.onload = () => {
      console.log("earth.jpeg loaded");
      applyHeightmapToAllBodies();
    };
    defaultGrayscaleImg.onerror = () => {
      console.warn("Failed to load earth.jpeg — put it in the same folder as index.html");
    };

    cloudImg.onload = () => {
      console.log("cloud.png loaded");
      processCloudImage(cloudImg);
    };
    cloudImg.onerror = () => {
      console.warn("Failed to load cloud.png — put it in the same folder as index.html (or upload one)");
    };

    defaultGrayscaleImg.src = 'earth.jpeg';
    cloudImg.src = 'cloud.png';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
    40, // More realistic human vision
    window.innerWidth / window.innerHeight,
    0.001, // Lets the camera get closer to the ground
    5000000 // Lets you see farther
);
    camera.position.set(0, AU * 0.8, AU * 1.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxDistance = 1500000;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let selectedObject = null;
    let isMovingMode = false;
    let isSurfaceView = false;

    const outlineGeo = new THREE.RingGeometry(1.2, 1.35, 64);
    const outlineMat = new THREE.MeshBasicMaterial({ color: 0x61afef, side: THREE.DoubleSide });
    const selectionOutline = new THREE.Mesh(outlineGeo, outlineMat);
    selectionOutline.visible = false;
    scene.add(selectionOutline);

    const ambientLight = new THREE.AmbientLight(0x555566, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 3.5, 0, 0.1);
    scene.add(sunLight);

    let simYearsPerSec = 0.0001; 
    let isPaused = false;

    let celestialBodies = [];
    let objectCounter = 1;
    let userUploadedImage = null;

    // Debris / dust particles from impacts & tidal disruption
    let debrisParticles = [];
    const MAX_DEBRIS = 280;
    // Geometry is unit; we scale each particle based on the body it came from
    const debrisGeo = new THREE.SphereGeometry(1.0, 5, 5);
    const debrisMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true });

    // Track debris disks around bodies for later re-accretion into a new moon
    // key = body reference, value = { totalMass, ageSec, lastClumpCheck }
    let debrisDisks = new Map();
    let moonReformCounter = 1;

    class CelestialBody {
      constructor(name, mass, radius, pos, vel, isStar = false) {
        this.name = name;
        this.mass = mass;
        this.baseRadius = radius;
        this.isStar = isStar;
        this.pos = pos.clone();
        this.vel = vel.clone();

        this.atmosphereType = 'earthlike';
        this.atmospherePressure = isStar ? 0.0 : 1.0;
        this.waterCoverage = isStar ? 0 : 56.5;

        this.climateFactor = 0.5;
        this.targetClimateFactor = 0.5;
        this.vegetationCoverage = 0.05;

        this.collisionHeatRemainingSec = 0;
        this.parentBody = null;

        // New features
        this.cityLightsEnabled = false;
        this.axialTilt = 0 * Math.PI / 180; // Earth-like tilt
        this.cloudOffset = Math.random() * 1000;
        this.textureDirty = true;
        this.cachedHeightGrid = null;
        this.frameCounter = 0;

        // Gradual collision / impact system (Universe Sandbox inspired)
        this.glowIntensity = 0;           // 0-1+ for impact heating glow
        this.impactRelSpeed = 0;          // relative speed at impact start
        this.isBeingAbsorbed = false;
        this.absorbingInto = null;        // reference to larger body
        this.absorbProgress = 0;          // 0-1 how much mass transferred
        this.impactScar = 0;              // residual surface damage strength
        this.shockwavePhase = -1;         // -1 = none, 0..1 = traveling around body
        this.shockwaveStrength = 0;
        this.originalMass = mass;
        this.originalRadius = radius;

        // Pure 2D texture (higher res but still performant with dirty flag)
        this.canvas = document.createElement('canvas');
        this.canvas.width = 1024;
        this.canvas.height = 512;
        this.ctx = this.canvas.getContext('2d');
        this.texture = new THREE.CanvasTexture(this.canvas);

        // SMOOTH SPHERE ONLY — zero 3D terrain
        this.geometry = new THREE.SphereGeometry(radius, 64, 64);

        if (this.isStar) {
          this.material = new THREE.MeshBasicMaterial({ color: 0xffddaa });
        } else {
          this.material = new THREE.MeshStandardMaterial({
            map: this.texture,
            roughness: 0.85,
            flatShading: false,
            emissive: new THREE.Color(0x000000),
            emissiveIntensity: 0,
            emissiveMap: null
          });
        }

        this.mesh = new THREE.Mesh(this.geometry, this.material);
        this.mesh.position.copy(this.pos);
        this.mesh.userData.body = this;
        // Only Earth gets axial tilt
        if (name === "Earth") {
          this.mesh.rotation.z = this.axialTilt;
        }
        scene.add(this.mesh);

        // Atmosphere
        const atmosGeo = new THREE.SphereGeometry(radius * (this.isStar ? 1.15 : 1.05), 32, 32);
        const atmosMat = new THREE.MeshBasicMaterial({
          color: this.isStar ? 0xffaa22 : 0x61afef,
          transparent: true,
          opacity: this.isStar ? 0.6 : 0.25,
          side: THREE.BackSide
        });
        this.atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
        this.mesh.add(this.atmosMesh);

        this.ringsGroup = new THREE.Group();
        this.mesh.add(this.ringsGroup);
        if (this.isStar) {
          this.createHabitabilityRings();
        } else {
          this.updateTextureAndDeform(true);
        }

        this.updateAtmosphereGlow();
      }

      createHabitabilityRings() {
        while (this.ringsGroup.children.length > 0) {
          const child = this.ringsGroup.children[0];
          this.ringsGroup.remove(child);
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }

        const createRing = (innerAU, outerAU, colorHex) => {
          const innerR = innerAU * AU;
          const outerR = outerAU * AU;
          const ringGeo = new THREE.RingGeometry(innerR, outerR, 128);
          const ringMat = new THREE.MeshBasicMaterial({
            color: colorHex,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.25
          });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.rotation.x = Math.PI / 2;
          return ringMesh;
        };

        this.ringsGroup.add(createRing(0.1, 0.75, 0xe06c75));  
        this.ringsGroup.add(createRing(0.75, 1.37, 0x98c379)); 
        this.ringsGroup.add(createRing(1.37, 3.5, 0x61afef));  
      }

      triggerCollisionShock() {
        // Surface-only shock (no atmosphere changes)
        this.collisionHeatRemainingSec = 12000000 * SECONDS_PER_YEAR; 
        this.waterCoverage = 0; 
        this.vegetationCoverage = 0.0;
        this.climateFactor = 1.0;
        this.glowIntensity = Math.max(this.glowIntensity, 2.5);
        this.impactScar = Math.max(this.impactScar, 1.2);
        this.textureDirty = true;
        this.updateTextureAndDeform(true);
        this.updateImpactGlow();
      }

      updateAtmosphereGlow() {
        if (!this.atmosMesh) return;
        
        if (this.isStar) {
          this.atmosMesh.visible = true;
          this.atmosMesh.material.color.setHex(0xffaa22);
          this.atmosMesh.material.opacity = 0.6;
          return;
        }

        // Impacts no longer change atmosphere appearance — only normal composition/pressure
        if (this.atmosphereType === 'vacuum' || this.atmospherePressure <= 0) {
          this.atmosMesh.visible = false;
        } else {
          this.atmosMesh.visible = true;
          let atmosColor = 0x61afef;
          if (this.atmosphereType === 'co2') atmosColor = 0xe5c07b;
          if (this.atmosphereType === 'methane') atmosColor = 0xc678dd;

          this.atmosMesh.material.color.setHex(atmosColor);
          this.atmosMesh.material.opacity = Math.min(0.85, 0.15 + this.atmospherePressure * 0.02);
          const scaleVal = 1.0 + Math.min(0.25, this.atmospherePressure * 0.005);
          this.atmosMesh.scale.setScalar(scaleVal);
        }
      }

      // Visual impact glow — SURFACE ONLY (no atmosphere changes)
      updateImpactGlow() {
        if (this.isStar || !this.material || !this.material.emissive) return;

        let emissiveSet = false;

        if (this.glowIntensity > 0.01) {
          // Color shifts from yellow-white (high speed) to deep orange-red (slower / melting)
          const t = Math.min(1, this.glowIntensity);
          const speedFactor = Math.min(1, this.impactRelSpeed / 80);
          const r = 1.0;
          const g = 0.18 + 0.5 * (1 - t) + 0.28 * speedFactor;
          const b = 0.04 + 0.35 * speedFactor * (1 - t * 0.55);
          this.material.emissive.setRGB(r, g, b);
          this.material.emissiveIntensity = Math.min(7.5, this.glowIntensity * 4.0 + speedFactor * 1.8);
          emissiveSet = true;
        } else if (this.impactScar > 0.03) {
          // Residual hot scar / molten mark on the surface
          this.material.emissive.setRGB(0.95, 0.22, 0.05);
          this.material.emissiveIntensity = Math.min(3.5, this.impactScar * 2.6);
          emissiveSet = true;
        }

        // Shockwave visual — surface-only pulse that travels around the body
        if (this.shockwavePhase >= 0 && this.shockwavePhase <= 1.4) {
          const pulse = Math.sin(this.shockwavePhase * Math.PI * 5) * 0.5 + 0.5;
          const fade = Math.max(0, 1 - this.shockwavePhase / 1.35);
          const str = this.shockwaveStrength * fade * (0.55 + 0.45 * pulse);
          // Whole surface lights up strongly during the shockwave
          this.material.emissive.setRGB(1.0, 0.35 + 0.3 * pulse, 0.06);
          this.material.emissiveIntensity = Math.max(this.material.emissiveIntensity || 0, str * 5.5 + 1.5);
          emissiveSet = true;
        }

        if (!emissiveSet) {
          this.material.emissive.setRGB(0, 0, 0);
          this.material.emissiveIntensity = 0;
        }
      }

      applyImpactScar(strength, isMajor = false) {
        this.impactScar = Math.min(2.2, this.impactScar + strength);
        // Longer lasting heat so the SURFACE stays molten-looking in the texture
        this.collisionHeatRemainingSec = Math.max(
          this.collisionHeatRemainingSec,
          strength * 12000000 * SECONDS_PER_YEAR
        );
        this.climateFactor = Math.min(1.0, this.climateFactor + strength * 0.8);
        this.vegetationCoverage = Math.max(0, this.vegetationCoverage - strength * 0.95);
        // Strong surface glow after impact
        this.glowIntensity = Math.max(this.glowIntensity, 1.1 + strength * 1.0);
        this.impactRelSpeed = Math.max(this.impactRelSpeed || 0, 45 + strength * 35);

        if (isMajor) {
          // Surface effects only — boil some water / scorch vegetation, no atmosphere change
          this.waterCoverage = Math.max(0, this.waterCoverage - strength * 40);
          this.shockwavePhase = 0;
          this.shockwaveStrength = Math.min(2.4, 1.0 + strength * 1.7);
          this.glowIntensity = Math.max(this.glowIntensity, 2.4 + strength);
        }
        // Do NOT call updateAtmosphereGlow for impact heat — atmosphere stays normal
        this.textureDirty = true;
        this.updateTextureAndDeform(true);
        this.updateImpactGlow();
      }

      rebuildHeightmap() {
        if (this.isStar) return;
        const activeImg = userUploadedImage || (defaultGrayscaleImg.complete && defaultGrayscaleImg.naturalWidth !== 0 ? defaultGrayscaleImg : null);
        const w = this.canvas.width, h = this.canvas.height;
        try {
          if (activeImg) {
            this.ctx.drawImage(activeImg, 0, 0, w, h);
          } else {
            // Neutral mid-high gray so a missing map is not entirely underwater
            this.ctx.fillStyle = '#b0b0b0';
            this.ctx.fillRect(0, 0, w, h);
          }
          const imgData = this.ctx.getImageData(0, 0, w, h);
          const src = imgData.data;
          const heightGrid = new Float32Array(w * h);
          let minH = 1, maxH = 0;
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              let sum = 0, count = 0;
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  const nx = (x + dx + w) % w;
                  const ny = Math.max(0, Math.min(h - 1, y + dy));
                  const i = (ny * w + nx) * 4;
                  sum += (src[i] + src[i+1] + src[i+2]) / 3 / 255;
                  count++;
                }
              }
              const v = sum / count;
              heightGrid[y * w + x] = v;
              if (v < minH) minH = v;
              if (v > maxH) maxH = v;
            }
          }
          // Normalize so darkest = 0, brightest = 1
          // Water % then means "lowest X% of this map is ocean" — works for ANY uploaded heightmap
          const range = Math.max(0.001, maxH - minH);
          for (let i = 0; i < heightGrid.length; i++) {
            heightGrid[i] = (heightGrid[i] - minH) / range;
          }
          this.cachedHeightGrid = heightGrid;
          this.textureDirty = true;
        } catch (e) {
          console.warn("rebuildHeightmap failed:", e);
        }
      }

      // PURE 2D texture. Only runs expensive work when dirty or forced.
      updateTextureAndDeform(force = false) {
        if (this.isStar) return;
        if (!this.cachedHeightGrid) this.rebuildHeightmap();
        if (!force && !this.textureDirty) return;
        if (!this.cachedHeightGrid) return;

        const w = this.canvas.width, h = this.canvas.height;
        const heightGrid = this.cachedHeightGrid;
        const waterThreshold = this.waterCoverage / 100;
        const isMoltenImpact = this.collisionHeatRemainingSec > 0;

        // Distance-based coldness (farther from star = more ice)
        let distAU = 1.0;
        const primary = findPrimaryStar();
        if (primary && primary !== this) {
          distAU = this.pos.distanceTo(primary.pos) / AU;
        }
        const distCold = Math.max(0, (distAU - 0.9) * 1.2); // starts growing ice beyond ~0.9 AU

        try {
          const imgData = this.ctx.createImageData(w, h);
          const data = imgData.data;

          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const idx = (y * w + x) * 4;
              const brightnessNorm = heightGrid[y * w + x];
              const elevation = brightnessNorm * 255;
              const landRatio = (brightnessNorm - waterThreshold) / Math.max(0.001, 1 - waterThreshold);

              // Latitude from UV (0 = north pole, 1 = south pole)
              const lat = (y / h) * 2 - 1; // -1 to +1
              const poleFactor = Math.pow(Math.abs(lat), 1.8); // stronger at poles

              if (isMoltenImpact) {
                data[idx] = 255; data[idx+1] = Math.min(255, 60 + elevation * 0.5);
                data[idx+2] = Math.min(100, elevation * 0.2); data[idx+3] = 255;
              } else if (landRatio < 0) {
                // 2D WATER — deeper darker, shallower lighter
                const depth = Math.min(1, Math.max(0, -landRatio));
                const shallow = 1 - depth;
                data[idx]   = Math.floor( 8 + shallow * 50 + elevation * 0.08);
                data[idx+1] = Math.floor(25 + shallow * 95 + elevation * 0.28);
                data[idx+2] = Math.floor(70 + shallow *150 + elevation * 0.40);
                data[idx+3] = 255;
              } else {
                // LAND base color
                if (this.waterCoverage === 0 || this.climateFactor > 0.8) {
                  data[idx] = Math.min(255, elevation * 0.85 + 50);
                  data[idx+1] = Math.min(255, elevation * 0.45 + 15);
                  data[idx+2] = Math.min(255, elevation * 0.25 + 10);
                } else if (landRatio <= this.vegetationCoverage && this.climateFactor >= 0.2) {
                  const vegI = Math.sin((this.climateFactor - 0.2) / 0.6 * Math.PI);
                  data[idx] = Math.min(255, elevation * 0.22);
                  data[idx+1] = Math.min(255, 105 + elevation * 0.55 * vegI);
                  data[idx+2] = Math.min(255, elevation * 0.18);
                } else {
                  data[idx] = Math.min(255, elevation * 0.7 + 45);
                  data[idx+1] = Math.min(255, elevation * 0.5 + 25);
                  data[idx+2] = Math.min(255, elevation * 0.3 + 10);
                }

                // ICE — poles + high elevation + distance from star
                // Higher terrain = colder
                const elevCold = Math.max(0, (brightnessNorm - 0.55) * 2.2);
                const iceAmount = Math.min(1, poleFactor * 1.4 + elevCold * 0.9 + distCold + (this.climateFactor < 0.3 ? 0.5 : 0));
                if (iceAmount > 0.35) {
                  const iceStrength = Math.min(1, (iceAmount - 0.35) * 1.8);
                  data[idx]   = Math.min(255, data[idx]   * (1 - iceStrength) + 230 * iceStrength);
                  data[idx+1] = Math.min(255, data[idx+1] * (1 - iceStrength) + 240 * iceStrength);
                  data[idx+2] = Math.min(255, data[idx+2] * (1 - iceStrength) + 255 * iceStrength);
                }

                // CITY LIGHTS — yellowish white, only on land
                if (this.cityLightsEnabled) {
                  const lightNoise = ((x * 73 + y * 149) % 170);
                  if (lightNoise < 3) {
                    data[idx]   = 255;
                    data[idx+1] = 235;
                    data[idx+2] = 180;
                  }
                }
                data[idx+3] = 255;
              }

              // CLOUDS — real cloud.png texture, scrolls slowly
              if (cloudImgReady && this.atmospherePressure > 0.1 && cloudPixelData) {
                const cW = cloudPixelData.width;
                const cH = cloudPixelData.height;
                const cx = ((x / w) * cW + this.cloudOffset * 0.4) % cW | 0;
                const cy = ((y / h) * cH + this.cloudOffset * 0.15) % cH | 0;
                const cIdx = (cy * cW + cx) * 4;
                // Use alpha or brightness of cloud map
                const cloudAlpha = cloudPixelData.data[cIdx + 3] / 255;
                const cloudBright = (cloudPixelData.data[cIdx] + cloudPixelData.data[cIdx+1] + cloudPixelData.data[cIdx+2]) / 3 / 255;
                const cloudStr = Math.max(cloudAlpha, cloudBright) * 0.7;
                if (cloudStr > 0.08) {
                  data[idx]   = Math.min(255, data[idx]   * (1 - cloudStr) + 250 * cloudStr);
                  data[idx+1] = Math.min(255, data[idx+1] * (1 - cloudStr) + 252 * cloudStr);
                  data[idx+2] = Math.min(255, data[idx+2] * (1 - cloudStr) + 255 * cloudStr);
                }
              }
            }
          }
          this.ctx.putImageData(imgData, 0, 0);
          this.texture.needsUpdate = true;
          this.textureDirty = false;
        } catch (e) {}
      }

      evaluateMassState() {
        if (this.mass >= 25000 && !this.isStar) {
          this.isStar = true;
          this.name = "Ignited Star " + objectCounter++;
          this.mesh.material = new THREE.MeshBasicMaterial({ color: 0xffddaa });
          this.glowIntensity = 0;
          this.createHabitabilityRings();
        } else if (this.mass >= 15 && this.mass < 25000 && !this.isStar) {
          this.name = "Gas Giant";
          this.baseRadius = EARTH_RADIUS * Math.pow(this.mass, 0.33);
          this.mesh.scale.setScalar(this.baseRadius / EARTH_RADIUS);
        } else if (!this.isStar && this.mass < 15) {
          // Keep terrestrial scale roughly consistent with mass changes from accretion
          // (but don't fight ongoing absorption shrink)
          if (!this.isBeingAbsorbed) {
            const targetR = EARTH_RADIUS * Math.pow(Math.max(0.01, this.mass), 0.28);
            this.baseRadius = targetR;
            this.mesh.scale.setScalar(targetR / EARTH_RADIUS);
          }
        }
      }

      destroy() {
        scene.remove(this.mesh);
        if (this.geometry) this.geometry.dispose();
        if (this.material) this.material.dispose();
        if (this.texture) this.texture.dispose();
        if (this.atmosMesh) {
          if (this.atmosMesh.geometry) this.atmosMesh.geometry.dispose();
          if (this.atmosMesh.material) this.atmosMesh.material.dispose();
        }
        this.isBeingAbsorbed = false;
        this.absorbingInto = null;
      }
    }

    function findPrimaryStar() {
      return celestialBodies.find(b => b.isStar) || null;
    }

    function spawnDebris(originPos, baseVel, count, speedScale, sizeScale = 1.0, colorHex = 0xff8844, options = {}) {
      const n = Math.min(count, MAX_DEBRIS - debrisParticles.length);
      const host = options.hostBody || null; // body the debris is orbiting / associated with
      const massPer = options.massPerParticle || 0.00008;
      const orbital = options.orbital || false;
      const longLived = options.longLived || false;

      for (let i = 0; i < n; i++) {
        const mat = debrisMat.clone();
        mat.color.setHex(colorHex);
        mat.transparent = true;
        const mesh = new THREE.Mesh(debrisGeo, mat);
        // Slight positional jitter so they don't all start on top of each other
        const jitter = new THREE.Vector3(
          (Math.random() - 0.5) * sizeScale * 1.5,
          (Math.random() - 0.5) * sizeScale * 1.5,
          (Math.random() - 0.5) * sizeScale * 1.5
        );
        mesh.position.copy(originPos).add(jitter);

        let vel;
        if (orbital && host) {
          // Give debris roughly circular / elliptical orbital velocity around host
          const rel = mesh.position.clone().sub(host.pos);
          const r = Math.max(host.baseRadius * 1.4, rel.length());
          const orbitalSpeed = Math.sqrt((G * host.mass) / r);
          // Perpendicular direction in the approximate orbital plane
          const up = new THREE.Vector3(0, 1, 0);
          let tangent = new THREE.Vector3().crossVectors(rel, up);
          if (tangent.lengthSq() < 0.001) tangent = new THREE.Vector3().crossVectors(rel, new THREE.Vector3(1, 0, 0));
          tangent.normalize();
          // Mix of orbital + random for a realistic disk
          const speed = orbitalSpeed * (0.75 + Math.random() * 0.55) * (0.85 + speedScale * 0.15);
          vel = tangent.multiplyScalar(speed * (Math.random() > 0.5 ? 1 : -1));
          // Small radial / vertical component so the disk has thickness
          vel.add(rel.clone().normalize().multiplyScalar((Math.random() - 0.4) * orbitalSpeed * 0.25));
          vel.add(host.vel);
        } else {
          const dir = new THREE.Vector3(
            (Math.random() - 0.5) * 2,
            (Math.random() - 0.5) * 2,
            (Math.random() - 0.5) * 2
          ).normalize();
          const speed = (8 + Math.random() * 45) * speedScale * Math.max(0.5, sizeScale * 0.6);
          vel = dir.multiplyScalar(speed).add(baseVel.clone().multiplyScalar(0.25));
        }

        const life = longLived ? 999999 : (5 + Math.random() * 10);
        const pScale = sizeScale * (0.3 + Math.random() * 1.3);
        debrisParticles.push({
          mesh,
          vel,
          life,
          maxLife: life,
          scale: pScale,
          mass: massPer * (0.6 + Math.random() * 0.8),
          hostBody: host,
          isOrbital: orbital,
          longLived: longLived
        });
        mesh.scale.setScalar(pScale);
        scene.add(mesh);
      }

      if (host && orbital) {
        if (!debrisDisks.has(host)) {
          debrisDisks.set(host, { totalMass: 0, ageSec: 0, lastClumpCheck: 0 });
        }
        const disk = debrisDisks.get(host);
        disk.totalMass += massPer * n;
      }
    }

    function updateDebris(realDt, simDt) {
      const toRemove = [];
      // Simple mutual attraction among nearby debris (limited pairs for performance)
      const mutualRange = 35;
      const mutualG = G * 40; // boosted so clumps form on human timescales

      for (let i = 0; i < debrisParticles.length; i++) {
        const p = debrisParticles[i];
        // Gravity toward host planet
        if (p.hostBody && celestialBodies.indexOf(p.hostBody) !== -1) {
          const toHost = new THREE.Vector3().subVectors(p.hostBody.pos, p.mesh.position);
          const dist = toHost.length();
          if (dist > 0.5) {
            const accel = (G * p.hostBody.mass) / (dist * dist);
            p.vel.addScaledVector(toHost.normalize(), accel * (simDt || realDt * 0.5));
          }
          // Fall onto planet → crater / scar
          if (dist < p.hostBody.baseRadius * 1.05) {
            p.hostBody.applyImpactScar(0.08 + p.mass * 40, false);
            p.hostBody.mass += p.mass;
            toRemove.push(i);
            if (debrisDisks.has(p.hostBody)) {
              debrisDisks.get(p.hostBody).totalMass = Math.max(0, debrisDisks.get(p.hostBody).totalMass - p.mass);
            }
            continue;
          }
        }

        // Limited mutual attraction (sample a few neighbors)
        if (p.isOrbital && i % 3 === 0) {
          for (let j = i + 1; j < Math.min(i + 8, debrisParticles.length); j++) {
            const q = debrisParticles[j];
            if (!q.isOrbital) continue;
            const dvec = new THREE.Vector3().subVectors(q.mesh.position, p.mesh.position);
            const d = dvec.length();
            if (d > 0.5 && d < mutualRange) {
              const f = (mutualG * p.mass * q.mass) / (d * d);
              const a = dvec.normalize().multiplyScalar(f);
              p.vel.addScaledVector(a, simDt * 0.5 / Math.max(0.0001, p.mass));
              q.vel.addScaledVector(a, -simDt * 0.5 / Math.max(0.0001, q.mass));
              // Merge if very close → clump
              if (d < (p.scale + q.scale) * 0.9) {
                p.mass += q.mass;
                p.scale = Math.min(p.scale * 1.15, 4.5);
                p.mesh.scale.setScalar(p.scale);
                toRemove.push(j);
              }
            }
          }
        }

        // Integrate
        const step = p.longLived ? (simDt || realDt * 8) : realDt * 22;
        p.mesh.position.addScaledVector(p.vel, step);

        if (!p.longLived) {
          p.life -= realDt;
          if (p.life <= 0) {
            toRemove.push(i);
            continue;
          }
          const alpha = Math.max(0, p.life / p.maxLife);
          p.mesh.material.opacity = alpha * 0.95;
          p.mesh.scale.setScalar(p.scale * (0.25 + 0.75 * alpha));
        } else {
          p.mesh.material.opacity = 0.85;
        }
      }

      // Remove marked (from back)
      toRemove.sort((a, b) => b - a);
      const unique = [...new Set(toRemove)];
      for (const idx of unique) {
        if (idx < 0 || idx >= debrisParticles.length) continue;
        const p = debrisParticles[idx];
        scene.remove(p.mesh);
        if (p.mesh.geometry) p.mesh.geometry.dispose();
        if (p.mesh.material) p.mesh.material.dispose();
        debrisParticles.splice(idx, 1);
      }

      // Age debris disks and try to re-form a moon when enough mass has orbited long enough
      debrisDisks.forEach((disk, host) => {
        if (celestialBodies.indexOf(host) === -1) {
          debrisDisks.delete(host);
          return;
        }
        disk.ageSec += simDt || realDt;
        disk.lastClumpCheck += realDt;
        // After significant time and enough remaining mass → form Moon-1 (or Moon-N)
        const years = disk.ageSec / SECONDS_PER_YEAR;
        if (disk.lastClumpCheck > 2.5 && disk.totalMass > 0.0025 && years > 0.00001) {
          disk.lastClumpCheck = 0;
          // Count orbital debris still bound to this host
          let boundMass = 0;
          let avgPos = new THREE.Vector3();
          let avgVel = new THREE.Vector3();
          let count = 0;
          debrisParticles.forEach(p => {
            if (p.hostBody === host && p.isOrbital) {
              boundMass += p.mass;
              avgPos.add(p.mesh.position);
              avgVel.add(p.vel);
              count++;
            }
          });
          if (count > 12 && boundMass > 0.0035) {
            avgPos.multiplyScalar(1 / count);
            avgVel.multiplyScalar(1 / count);
            // Remove the debris that will become the new moon
            for (let i = debrisParticles.length - 1; i >= 0; i--) {
              const p = debrisParticles[i];
              if (p.hostBody === host && p.isOrbital) {
                scene.remove(p.mesh);
                if (p.mesh.geometry) p.mesh.geometry.dispose();
                if (p.mesh.material) p.mesh.material.dispose();
                debrisParticles.splice(i, 1);
              }
            }
            const newMass = Math.min(0.02, boundMass * 0.92);
            const newRadius = MOON_RADIUS * Math.pow(newMass / 0.0123, 0.33);
            const newMoon = new CelestialBody(
              `Moon-${moonReformCounter++}`,
              newMass,
              newRadius,
              avgPos,
              avgVel
            );
            newMoon.parentBody = host;
            newMoon.atmosphereType = 'vacuum';
            newMoon.atmospherePressure = 0;
            newMoon.waterCoverage = 0;
            newMoon.updateTextureAndDeform(true);
            celestialBodies.push(newMoon);
            populateObjectDropdown();
            debrisDisks.delete(host);
          }
        }
      });
    }

    function populateObjectDropdown() {
      const select = document.getElementById('active-object-select');
      select.innerHTML = '';
      celestialBodies.forEach((body, idx) => {
        const option = document.createElement('option');
        option.value = idx;
        option.textContent = body.name;
        select.appendChild(option);
      });
      if (selectedObject) {
        select.value = celestialBodies.indexOf(selectedObject);
      }
    }

    function focusCameraOn(body) {
      if (!body) return;
      isSurfaceView = false;
      document.getElementById('surface-view-btn').classList.remove('active');
      document.getElementById('surface-view-btn').textContent = "View from Surface";

      controls.target.copy(body.pos);
      const distOffset = Math.max(body.baseRadius * 18, 25);
      const direction = camera.position.clone().sub(controls.target).normalize();
      
      camera.position.copy(body.pos).add(direction.multiplyScalar(distOffset));
      controls.update();
    }

    function toggleSurfaceView() {
      if (!selectedObject) return;
      
      isSurfaceView = !isSurfaceView;
      const surfaceBtn = document.getElementById('surface-view-btn');

      if (isSurfaceView) {
        surfaceBtn.classList.add('active');
        surfaceBtn.textContent = "Exit Surface View";

        // Place camera at surface standing height facing outward along the horizon
        const surfaceDir = new THREE.Vector3(0, 1, 0.2).normalize(); 
        // Stand almost directly on the surface instead of floating above it.
        // Stay a safe distance above the surface.
           // Human eye height (about 1.7 meters, scaled to your world)
           const eyeHeight = selectedObject.baseRadius * 0.00005;
           const standingHeight = selectedObject.baseRadius + eyeHeight; 
        
        const eyeLevelPos = selectedObject.pos.clone().add(surfaceDir.clone().multiplyScalar(standingHeight));
        // Surface normal
const up = surfaceDir.clone();

// Pick a reference axis
let reference = new THREE.Vector3(0, 1, 0);

if (Math.abs(up.dot(reference)) > 0.95)
    reference.set(1, 0, 0);

// Compute a forward direction that is tangent to the planet
const forward = new THREE.Vector3()
    .crossVectors(reference, up)
    .normalize();

// Look perfectly along the horizon
const viewTargetPos = eyeLevelPos.clone().add(
    forward.multiplyScalar(1000)
);

camera.lookAt(viewTargetPos);

        camera.position.copy(eyeLevelPos);
        controls.target.copy(viewTargetPos);
        camera.lookAt(viewTargetPos);
        controls.enabled = !isSurfaceView;

if (!isSurfaceView) {
    controls.update();
}
      } else {
        focusCameraOn(selectedObject);
      }
    }

    document.getElementById('surface-view-btn').addEventListener('click', toggleSurfaceView);

    const sun = new CelestialBody("Sun", SUN_MASS, SUN_RADIUS, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 0), true);
    celestialBodies.push(sun);

    const earthOrbVel = Math.sqrt((G * sun.mass) / AU);
    const earthPos = new THREE.Vector3(AU, 0, 0);
    const earthVel = new THREE.Vector3(0, 0, earthOrbVel);
    const earth = new CelestialBody("Earth", 1.0, EARTH_RADIUS, earthPos, earthVel);
    celestialBodies.push(earth);

    // Moon on an angled collision course with Earth (giant-impact style)
    // Offset so it approaches with an impact parameter (not head-on)
    const impactApproachDist = 95.0; // starting separation
    const impactParam = 18.0;       // offset so it hits at an angle
    const moonPos = earthPos.clone().add(new THREE.Vector3(impactApproachDist, impactParam * 0.6, impactParam));
    // Velocity aimed mostly toward Earth but with a tangential component for the angle
    const toEarth = new THREE.Vector3().subVectors(earthPos, moonPos).normalize();
    const approachSpeed = Math.sqrt((G * earth.mass) / impactApproachDist) * 1.35; // slightly super-circular so it reaches
    const tangent = new THREE.Vector3(-toEarth.z, 0.15, toEarth.x).normalize();
    const moonVel = earthVel.clone()
      .add(toEarth.multiplyScalar(approachSpeed * 0.92))
      .add(tangent.multiplyScalar(approachSpeed * 0.38));
    const moon = new CelestialBody("Moon", 0.0123, MOON_RADIUS, moonPos, moonVel);
    moon.parentBody = earth;
    moon.atmosphereType = 'vacuum';
    moon.atmospherePressure = 0.0;
    moon.waterCoverage = 0;
    moon.updateTextureAndDeform();
    celestialBodies.push(moon);

    selectObject(earth);

    // If images already finished loading before bodies existed, apply them now
    if (defaultGrayscaleImg.complete && defaultGrayscaleImg.naturalWidth > 0) {
      applyHeightmapToAllBodies();
    }
    if (cloudImg.complete && cloudImg.naturalWidth > 0 && !cloudImgReady) {
      processCloudImage(cloudImg);
    }

    document.getElementById('spawn-btn').addEventListener('click', () => {
      const type = document.getElementById('spawn-type').value;
      const distAU = parseFloat(document.getElementById('spawn-distance').value) || 0;
      const spawnDist = distAU * AU;

      const primaryStar = findPrimaryStar();
      const centerPos = primaryStar ? primaryStar.pos : new THREE.Vector3(0, 0, 0);

      let spawnPos = centerPos.clone().add(new THREE.Vector3(spawnDist, 0, 0));
      let spawnVel = new THREE.Vector3(0, 0, 0);

      let newBody = null;
      if (type === 'star') {
        newBody = new CelestialBody(`Star ${objectCounter++}`, SUN_MASS, SUN_RADIUS, spawnPos, spawnVel, true);
      } else if (type === 'planet') {
        if (primaryStar && spawnDist > 0) {
          const v = Math.sqrt((G * primaryStar.mass) / spawnDist);
          spawnVel.set(0, 0, v);
        }
        newBody = new CelestialBody(`Planet ${objectCounter++}`, 1.0, EARTH_RADIUS, spawnPos, spawnVel);
      } else if (type === 'moon') {
        let parentObj = selectedObject || earth;
        if (parentObj && !parentObj.isStar) {
          spawnPos = parentObj.pos.clone().add(new THREE.Vector3(MOON_ORBIT_DIST, 0, 0));
          const v = Math.sqrt((G * parentObj.mass) / MOON_ORBIT_DIST);
          spawnVel = parentObj.vel.clone().add(new THREE.Vector3(0, 0, v));
        } else if (primaryStar && spawnDist > 0) {
          const v = Math.sqrt((G * primaryStar.mass) / spawnDist);
          spawnVel.set(0, 0, v);
        }
        newBody = new CelestialBody(`Moon ${objectCounter++}`, 0.012, MOON_RADIUS, spawnPos, spawnVel);
        if (parentObj && !parentObj.isStar) newBody.parentBody = parentObj;
        newBody.atmosphereType = 'vacuum';
        newBody.atmospherePressure = 0.0;
        newBody.waterCoverage = 0;
        newBody.updateTextureAndDeform();
      }
      
      if (newBody) {
        celestialBodies.push(newBody);
        selectObject(newBody);
      }
    });

    });

    const moveBtn = document.getElementById('move-toggle-btn');
    moveBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!selectedObject) return;

      isMovingMode = !isMovingMode;
      if (isMovingMode) {
        moveBtn.textContent = "Place Planet";
        moveBtn.classList.add('active');
        controls.enabled = false; 

        const primaryStar = findPrimaryStar();
        const centerPos = primaryStar ? primaryStar.pos : new THREE.Vector3(0, 0, 0);
        
        controls.target.copy(centerPos);
        camera.position.set(centerPos.x, centerPos.y + AU * 3.5, centerPos.z + 10);
        camera.lookAt(centerPos);
        controls.update();
      } else {
        finalizePlacement();
      }
    });

    function finalizePlacement() {
      isMovingMode = false;
      moveBtn.textContent = "Move Planet";
      moveBtn.classList.remove('active');
      controls.enabled = true;

      if (selectedObject) {
        const primaryStar = findPrimaryStar();
        if (primaryStar && primaryStar !== selectedObject) {
          const dist = selectedObject.pos.distanceTo(primaryStar.pos);
          const orbSpeed = Math.sqrt((G * primaryStar.mass) / dist);
          
          const dir = new THREE.Vector3().subVectors(selectedObject.pos, primaryStar.pos).normalize();
          const tangent = new THREE.Vector3(-dir.z, 0, dir.x);
          selectedObject.vel.copy(tangent.multiplyScalar(orbSpeed));
        } else {
          selectedObject.vel.set(0, 0, 0);
        }

        celestialBodies.forEach(child => {
          if (child.parentBody === selectedObject) {
            child.pos.copy(selectedObject.pos).add(new THREE.Vector3(MOON_ORBIT_DIST, 0, 0));
            const v = Math.sqrt((G * selectedObject.mass) / MOON_ORBIT_DIST);
            child.vel.copy(selectedObject.vel).add(new THREE.Vector3(0, 0, v));
          }
        });

        focusCameraOn(selectedObject);
      }
    }

    const orbitPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    function handlePointerMove(e) {
      if (!isMovingMode || !selectedObject) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersectPoint = new THREE.Vector3();
      raycaster.ray.intersectPlane(orbitPlane, intersectPoint);

      if (intersectPoint) {
        const delta = intersectPoint.clone().sub(selectedObject.pos);
        selectedObject.pos.copy(intersectPoint);
        selectedObject.mesh.position.copy(selectedObject.pos);
        selectedObject.vel.set(0, 0, 0);

        celestialBodies.forEach(child => {
          if (child.parentBody === selectedObject) {
            child.pos.add(delta);
            child.mesh.position.copy(child.pos);
          }
        });
      }
    }

    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handlePointerMove(e.touches[0]);
      }
    });

    window.addEventListener('click', (e) => {
      if (e.target.closest('.panel')) return;

      if (isMovingMode) {
        finalizePlacement();
        return;
      }

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const meshesToTest = celestialBodies.map(b => b.mesh).filter(Boolean);
      const intersects = raycaster.intersectObjects(meshesToTest);

      if (intersects.length > 0) {
        selectObject(intersects[0].object.userData.body);
      }
    });

    function selectObject(body) {
      if (!body) return;

      if (isMovingMode) {
        finalizePlacement();
      }

      selectedObject = body;
      
      populateObjectDropdown();
      document.getElementById('active-object-select').value = celestialBodies.indexOf(body);

      document.getElementById('mass-input').value = body.mass;
      document.getElementById('atmosphere-type').value = body.atmosphereType;
      document.getElementById('atmosphere-pressure').value = body.atmospherePressure;
      document.getElementById('pressure-val').textContent = body.atmospherePressure.toFixed(1);
      document.getElementById('water-coverage').value = body.waterCoverage;

      // Update city lights button for selected object
      const lightsBtn = document.getElementById('city-lights-btn');
      if (lightsBtn) {
        lightsBtn.textContent = body.cityLightsEnabled ? "Disable City Lights" : "Enable City Lights";
        lightsBtn.style.display = body.isStar ? 'none' : 'block';
      }

      selectionOutline.visible = true;
      updateInspectorStats(body);

      focusCameraOn(body);
    }

    document.getElementById('active-object-select').addEventListener('change', (e) => {
      const idx = parseInt(e.target.value);
      if (celestialBodies[idx]) {
        selectObject(celestialBodies[idx]);
      }
    });

    function updateInspectorStats(body) {
      if (!body) return;
      const primaryStar = findPrimaryStar();
      
      let distText = "N/A";
      let zoneText = "N/A";
      let climateText = "N/A";
      let habitabilityScore = 0;

      if (primaryStar && primaryStar !== body) {
        const distToSun = body.pos.distanceTo(primaryStar.pos);
        distText = (distToSun / AU).toFixed(2) + " AU";

        if (distToSun < AU * 0.75) {
          zoneText = "Scorched Zone";
        } else if (distToSun > AU * 1.37) {
          zoneText = "Frozen Deep Space";
        } else {
          zoneText = "Habitable Zone";
        }
      }

      if (body.collisionHeatRemainingSec > 0) {
        const yrsRemaining = Math.round(body.collisionHeatRemainingSec / SECONDS_PER_YEAR);
        climateText = ` MOLTEN COLLISION SHOCK (${(yrsRemaining / 1000000).toFixed(1)}M Yrs)`;
      } else if (body.climateFactor > 0.75) {
        climateText = "Thermal Runaway / Boiling";
      } else if (body.climateFactor < 0.25) {
        climateText = "Frigid Glacial Ice";
      } else {
        climateText = "Temperate Greenery";
      }

      if (!body.isStar) {
        if (body.collisionHeatRemainingSec > 0) {
          habitabilityScore = 0; 
        } else {
          const distancePenalty = Math.abs(body.climateFactor - 0.5) * 2;
          const atmosPenalty = Math.min(1.0, Math.abs(body.atmospherePressure - 1.0) / 10);
          const waterBonus = body.waterCoverage > 20 && body.waterCoverage < 85 ? 1 : 0.3;
          const compositionBonus = body.atmosphereType === 'earthlike' ? 1 : 0.2;

          habitabilityScore = Math.max(0, Math.round((1 - distancePenalty) * waterBonus * compositionBonus * (1 - atmosPenalty) * 100));
        }
      }

      document.getElementById('obj-type').textContent = body.isStar ? "Star" : (body.mass >= 15 ? "Gas Giant" : "Terrestrial Body");
      document.getElementById('obj-dist').textContent = distText;
      document.getElementById('obj-zone').textContent = zoneText;
      document.getElementById('obj-habitability').textContent = body.isStar ? "N/A" : habitabilityScore + "%";
      document.getElementById('obj-veg-coverage').textContent = body.isStar ? "N/A" : Math.round(body.vegetationCoverage * 100) + "%";

      const climateEl = document.getElementById('obj-climate-progress');
      climateEl.textContent = climateText;
      if (body.collisionHeatRemainingSec > 0) {
        climateEl.className = "stat-val status-alert";
      } else {
        climateEl.className = "stat-val";
      }
    }

    document.getElementById('atmosphere-type').addEventListener('change', (e) => {
      if (selectedObject) {
        selectedObject.atmosphereType = e.target.value;
        selectedObject.updateAtmosphereGlow();
        selectedObject.updateTextureAndDeform();
      }
    });

    document.getElementById('atmosphere-pressure').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('pressure-val').textContent = val.toFixed(1);
      if (selectedObject) {
        selectedObject.atmospherePressure = val;
        selectedObject.updateAtmosphereGlow();
      }
    });

    document.getElementById('water-coverage').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (isNaN(val)) return;
      if (selectedObject) {
        selectedObject.waterCoverage = Math.max(0, Math.min(100, val));
        selectedObject.textureDirty = true;
        selectedObject.updateTextureAndDeform(true);
      }
    });

    document.getElementById('city-lights-btn').addEventListener('click', () => {
      if (!selectedObject || selectedObject.isStar) return;
      selectedObject.cityLightsEnabled = !selectedObject.cityLightsEnabled;
      selectedObject.textureDirty = true;
      selectedObject.updateTextureAndDeform(true);
      const btn = document.getElementById('city-lights-btn');
      btn.textContent = selectedObject.cityLightsEnabled ? "Disable City Lights" : "Enable City Lights";
    });

    document.getElementById('delete-obj-btn').addEventListener('click', () => {
      if (selectedObject) {
        const idx = celestialBodies.indexOf(selectedObject);
        if (idx !== -1) {
          selectedObject.destroy();
          celestialBodies.splice(idx, 1);
        }
        if (celestialBodies.length > 0) {
          selectObject(celestialBodies[0]);
        } else {
          selectedObject = null;
          selectionOutline.visible = false;
          populateObjectDropdown();
        }
      }
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      celestialBodies.forEach(b => b.destroy());
      celestialBodies = [];
      selectedObject = null;
      selectionOutline.visible = false;
      // Clear debris
      debrisParticles.forEach(p => {
        scene.remove(p.mesh);
        if (p.mesh.geometry) p.mesh.geometry.dispose();
        if (p.mesh.material) p.mesh.material.dispose();
      });
      debrisParticles = [];
      debrisDisks.clear();
      populateObjectDropdown();
    });

    document.getElementById('apply-mass-btn').addEventListener('click', () => {
      if (selectedObject) {
        const newMass = parseFloat(document.getElementById('mass-input').value);
        if (!isNaN(newMass) && newMass > 0) {
          selectedObject.mass = newMass;
          selectedObject.evaluateMassState();
          updateInspectorStats(selectedObject);
        }
      }
    });

    const simSpeedInput = document.getElementById('sim-speed-input');
    simSpeedInput.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      simYearsPerSec = isNaN(val) || val < 0 ? 0 : val;
    });

    const pauseBtn = document.getElementById('pause-btn');
    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? "Resume Simulation" : "Pause Simulation";
    });

    document.getElementById('reset-cam-btn').addEventListener('click', () => {
      const primaryStar = findPrimaryStar();
      if (primaryStar) {
        selectObject(primaryStar);
      } else {
        controls.target.set(0, 0, 0);
      }
    });

    function updatePhysics() {
      if (isPaused || simYearsPerSec <= 0) return;

      const realDeltaTimeSec = 0.016; 
      const simDeltaTimeSec = realDeltaTimeSec * simYearsPerSec * SECONDS_PER_YEAR;

      const steps = Math.min(200, Math.max(8, Math.floor(simYearsPerSec * 1.5)));
      const dt = simDeltaTimeSec / steps;

      let bodiesToRemove = new Set();

      for (let s = 0; s < steps; s++) {
        for (let i = 0; i < celestialBodies.length; i++) {
          for (let j = i + 1; j < celestialBodies.length; j++) {
            const b1 = celestialBodies[i];
            const b2 = celestialBodies[j];

            if (bodiesToRemove.has(b1) || bodiesToRemove.has(b2)) continue;
            if ((isMovingMode && b1 === selectedObject) || (isMovingMode && b2 === selectedObject)) continue;

            // Skip if one is already being fully absorbed
            if (b1.isBeingAbsorbed || b2.isBeingAbsorbed) continue;

            const dir = new THREE.Vector3().subVectors(b2.pos, b1.pos);
            const dist = dir.length();
            if (dist < 0.001) continue;

            const sumR = b1.baseRadius + b2.baseRadius;
            const collisionDist = sumR * 0.98;

            // Gravity always (stronger attraction from higher mass is natural)
            if (dist > 1.5) {
              const force = (G * b1.mass * b2.mass) / (dist * dist);
              const accel1 = dir.clone().normalize().multiplyScalar(force / b1.mass);
              const accel2 = dir.clone().normalize().multiplyScalar(-force / b2.mass);
              b1.vel.addScaledVector(accel1, dt);
              b2.vel.addScaledVector(accel2, dt);
            }

            // Tidal stretch visual when a smaller body approaches a much larger one
            {
              let largerT = b1.mass >= b2.mass ? b1 : b2;
              let smallerT = b1.mass >= b2.mass ? b2 : b1;
              if (!smallerT.isStar && !smallerT.isBeingAbsorbed && largerT.mass > smallerT.mass * 8) {
                const approach = (largerT.baseRadius * 4.5 - dist) / (largerT.baseRadius * 3.5);
                if (approach > 0 && approach < 1.2) {
                  const stretch = 1 + Math.min(1.8, approach * 1.6);
                  const squash = 1 / Math.sqrt(stretch);
                  // Elongate along the line connecting the two bodies
                  const axis = dir.clone().normalize();
                  // Approximate stretch by non-uniform scale (good enough visually)
                  smallerT.mesh.scale.set(
                    smallerT.baseRadius / Math.max(0.01, smallerT.originalRadius || smallerT.baseRadius) * (axis.x !== 0 ? stretch : squash),
                    smallerT.baseRadius / Math.max(0.01, smallerT.originalRadius || smallerT.baseRadius) * squash,
                    smallerT.baseRadius / Math.max(0.01, smallerT.originalRadius || smallerT.baseRadius) * (Math.abs(axis.z) > 0.3 ? stretch : squash)
                  );
                  smallerT.glowIntensity = Math.max(smallerT.glowIntensity, approach * 1.4);
                  smallerT.updateImpactGlow();
                }
              }
            }

            // Gradual collision / merge / disruption when overlapping
            if (dist <= collisionDist) {
              let larger = b1.mass >= b2.mass ? b1 : b2;
              let smaller = b1.mass >= b2.mass ? b2 : b1;

              const relVel = b1.vel.distanceTo(b2.vel);
              const impactEnergy = 0.5 * smaller.mass * relVel * relVel;
              const sizeRef = Math.max(2.5, larger.baseRadius * 0.18);
              const massRatio = smaller.mass / Math.max(0.01, larger.mass);

              // Major impact → tidal disruption into orbiting debris disk (giant-impact style)
              const isDisruptive = massRatio > 0.004 && (relVel > 25 || impactEnergy > 15 || massRatio > 0.008);

              if (!smaller.isBeingAbsorbed) {
                smaller.isBeingAbsorbed = true;
                smaller.absorbingInto = larger;
                smaller.absorbProgress = 0;
                smaller.impactRelSpeed = relVel;
                smaller.glowIntensity = Math.min(4.5, 1.4 + relVel * 0.04);
                smaller.originalMass = smaller.mass;
                smaller.originalRadius = smaller.baseRadius;
                smaller.updateImpactGlow();

                if (isDisruptive) {
                  // Disrupt most of the smaller body into a long-lived orbital debris disk
                  const contactPoint = smaller.pos.clone().lerp(larger.pos, 0.45);
                  const debrisMass = smaller.mass * 0.82;
                  const nDebris = Math.min(120, 40 + Math.floor(smaller.mass * 800) + Math.floor(relVel * 0.4));
                  const massPer = debrisMass / nDebris;
                  spawnDebris(
                    contactPoint,
                    smaller.vel,
                    nDebris,
                    1.0,
                    sizeRef * 0.9,
                    0xffcc66,
                    {
                      hostBody: larger,
                      massPerParticle: massPer,
                      orbital: true,
                      longLived: true
                    }
                  );
                  // Some material falls straight in (creates crater / surface heat)
                  const infall = smaller.mass * 0.12;
                  larger.mass += infall;
                  larger.applyImpactScar(0.4 + massRatio * 8, true);
                  // Remaining mass will be absorbed during the short merge phase
                  smaller.mass *= 0.06;
                } else {
                  // Normal small impact: spray short-lived debris
                  const contactPoint = smaller.pos.clone().lerp(larger.pos, smaller.baseRadius / sumR);
                  const debrisCount = Math.min(40, 10 + Math.floor(relVel * 0.4) + Math.floor(smaller.mass * 6));
                  spawnDebris(contactPoint, smaller.vel, debrisCount, 1.1 + relVel * 0.02, sizeRef, relVel > 50 ? 0xffee88 : 0xff6622);
                }
              }

              // Transfer remaining mass over a short time
              const overlap = Math.max(0, collisionDist - dist);
              const transferRate = (0.3 + relVel * 0.012 + overlap * 0.04) * (dt / SECONDS_PER_YEAR) * 70;
              const massToTransfer = Math.min(smaller.mass * 0.2, smaller.mass * Math.min(0.5, transferRate));

              if (massToTransfer > 0 && smaller.mass > 0.0003) {
                smaller.mass -= massToTransfer;
                larger.mass += massToTransfer;
                smaller.absorbProgress = 1 - (smaller.mass / Math.max(0.0001, smaller.originalMass));

                const scaleFactor = Math.max(0.05, Math.pow(smaller.mass / smaller.originalMass, 0.36));
                smaller.baseRadius = smaller.originalRadius * scaleFactor;
                smaller.mesh.scale.setScalar(scaleFactor);

                const pullDir = dir.clone().normalize();
                const targetDist = larger.baseRadius * 0.88;
                const push = Math.max(0, targetDist - dist) * 0.6;
                if (b1 === smaller) smaller.pos.addScaledVector(pullDir, -push);
                else smaller.pos.addScaledVector(pullDir, push);
                const avgVel = larger.vel.clone().add(smaller.vel).multiplyScalar(0.5);
                smaller.vel.lerp(avgVel, 0.45);
                larger.vel.lerp(avgVel, 0.12);

                smaller.glowIntensity = Math.min(5.0, smaller.glowIntensity + 0.05);
                smaller.updateImpactGlow();
              }

              // Finalize
              if (smaller.mass < 0.008 || smaller.absorbProgress > 0.88) {
                larger.mass += smaller.mass;
                smaller.mass = 0;
                larger.evaluateMassState();
                const finalRatio = smaller.originalMass / Math.max(0.01, larger.mass);
                const isMajor = finalRatio > 0.02 || smaller.impactRelSpeed > 30;
                larger.applyImpactScar(Math.min(1.6, 0.2 + finalRatio * 4), isMajor);
                larger.glowIntensity = Math.max(larger.glowIntensity, isMajor ? 2.2 : 1.1);
                larger.updateImpactGlow();
                bodiesToRemove.add(smaller);
                if (selectedObject === smaller) selectObject(larger);
              }

              continue;
            }
          }
        }

        // Integrate positions
        celestialBodies.forEach(b => {
          if (bodiesToRemove.has(b)) return;
          if (isMovingMode && b === selectedObject) return;

          b.pos.addScaledVector(b.vel, dt);
          b.mesh.position.copy(b.pos);

          const rotationAngle = (simDeltaTimeSec / DAY_SECONDS) * Math.PI * 2;
          b.mesh.rotation.y += rotationAngle / steps;
        });
      }

      // Clean up fully absorbed bodies
      if (bodiesToRemove.size > 0) {
        bodiesToRemove.forEach(b => {
          const idx = celestialBodies.indexOf(b);
          if (idx !== -1) {
            // Final visual cleanup
            b.glowIntensity = 0;
            b.destroy();
            celestialBodies.splice(idx, 1);
          }
        });
        populateObjectDropdown();
      }

      // Update glows, shockwaves, residual scars every frame
      celestialBodies.forEach(b => {
        if (b.isStar) return;

        // Decay glow after impact (slower so you can actually see it)
        if (b.glowIntensity > 0) {
          b.glowIntensity = Math.max(0, b.glowIntensity - realDeltaTimeSec * 0.18);
        }
        // Decay residual scar (lingers longer)
        if (b.impactScar > 0) {
          b.impactScar = Math.max(0, b.impactScar - realDeltaTimeSec * 0.025);
        }
        // Advance shockwave (a bit slower so the circling/pulse is visible)
        if (b.shockwavePhase >= 0) {
          b.shockwavePhase += realDeltaTimeSec * 0.38;
          if (b.shockwavePhase > 1.4) {
            b.shockwavePhase = -1;
            b.shockwaveStrength = 0;
          }
        }
        b.updateImpactGlow();
      });

      // Update debris particles (real-time)
      updateDebris(realDeltaTimeSec, simDeltaTimeSec);

      // Climate & Active Green Vegetation Growth Spreading
      const primaryStar = findPrimaryStar();

      celestialBodies.forEach(b => {
        if (!b.isStar) {
          if (b.collisionHeatRemainingSec > 0) {
            b.collisionHeatRemainingSec = Math.max(0, b.collisionHeatRemainingSec - simDeltaTimeSec);
            b.climateFactor = 1.0;
            b.vegetationCoverage = 0.0;
            if (b.collisionHeatRemainingSec === 0) {
              b.updateAtmosphereGlow();
              b.updateTextureAndDeform();
            }
          } else {
            const baseYearProgress = simDeltaTimeSec / (10 * SECONDS_PER_YEAR);

            if (primaryStar) {
              const distToSun = b.pos.distanceTo(primaryStar.pos);
              const distAU = distToSun / AU;

              if (distAU < 0.75) {
                b.targetClimateFactor = 1.0;
                const heatMultiplier = Math.pow(0.75 / Math.max(0.05, distAU), 2);
                const changeRate = Math.min(1.0, baseYearProgress * heatMultiplier * 10);
                b.climateFactor = Math.min(1.0, b.climateFactor + changeRate);

                b.vegetationCoverage = Math.max(0, b.vegetationCoverage - changeRate * 2);

                if (b.waterCoverage > 0) {
                  const boilWaterAmount = Math.min(b.waterCoverage, changeRate * 50);
                  b.waterCoverage = Math.max(0, b.waterCoverage - boilWaterAmount);
                  b.atmospherePressure = Math.min(100.0, b.atmospherePressure + boilWaterAmount * 0.2); 
                  b.updateAtmosphereGlow();
                }

              } else if (distAU > 1.37) {
                b.targetClimateFactor = 0.0;
                const freezeMultiplier = Math.pow(distAU / 1.37, 2); 
                const freezeRate = Math.min(1.0, baseYearProgress * freezeMultiplier * 8);
                b.climateFactor = Math.max(0.0, b.climateFactor - freezeRate);
                b.vegetationCoverage = Math.max(0, b.vegetationCoverage - freezeRate * 2);

              } else {
                b.targetClimateFactor = 0.5;
                if (Math.abs(b.climateFactor - b.targetClimateFactor) > 0.0001) {
                  const diff = b.targetClimateFactor - b.climateFactor;
                  b.climateFactor += Math.sign(diff) * Math.min(Math.abs(diff), Math.min(1.0, baseYearProgress));
                }

                // VEGETATION ACTIVE EXPANSION OVER DRY LAND
                if (b.waterCoverage > 0 && b.waterCoverage < 100 && b.climateFactor >= 0.25 && b.climateFactor <= 0.75) {
                  const expansionSpeed = Math.min(0.2, baseYearProgress * 0.5);
                  const oldVeg = b.vegetationCoverage;
                  b.vegetationCoverage = Math.min(1.0, b.vegetationCoverage + expansionSpeed);
                  if (Math.abs(b.vegetationCoverage - oldVeg) > 0.003) b.textureDirty = true;
                } else {
                  const oldVeg = b.vegetationCoverage;
                  b.vegetationCoverage = Math.max(0, b.vegetationCoverage - baseYearProgress);
                  if (Math.abs(b.vegetationCoverage - oldVeg) > 0.003) b.textureDirty = true;
                }
              }
            } else {
              b.climateFactor = Math.max(0.0, b.climateFactor - Math.min(1.0, baseYearProgress * 10));
              b.vegetationCoverage = Math.max(0, b.vegetationCoverage - baseYearProgress);
              b.textureDirty = true;
            }
          }

          // Slowly scroll clouds
          b.cloudOffset = (b.cloudOffset || 0) + 0.15;
          b.frameCounter = (b.frameCounter || 0) + 1;
          // Only force a cloud/ice refresh every ~40 frames to stay smooth
          if (b.frameCounter % 40 === 0) b.textureDirty = true;

          b.updateTextureAndDeform();
        }
      });

      if (selectedObject && !isMovingMode) {
        if (!isSurfaceView) {
          const camDelta = new THREE.Vector3().subVectors(selectedObject.pos, controls.target);
          camera.position.add(camDelta);
          controls.target.copy(selectedObject.pos);

          let currentRadius = selectedObject.baseRadius;
          selectionOutline.position.copy(selectedObject.pos);
          selectionOutline.scale.setScalar(currentRadius * 1.3);
          selectionOutline.lookAt(camera.position);
        } else {
          // Keep surface camera anchored relative to moving planet position
          // Random place on the planet so you don't always spawn at the exact same spot.
          const surfaceDir = new THREE.Vector3(
            Math.random() - 0.5,
            Math.random() - 0.5,
            Math.random() - 0.5
            ).normalize(); 
          const standingHeight = selectedObject.baseRadius * 1.03; 
          
          const eyeLevelPos = selectedObject.pos.clone().add(surfaceDir.clone().multiplyScalar(standingHeight));
          // Look toward the horizon instead of into space.
          const up = surfaceDir.clone();

          let east = new THREE.Vector3(0,1,0);

          if (Math.abs(up.dot(east)) > 0.95)
             east.set(1,0,0);

          const forward = new THREE.Vector3()
            .crossVectors(east, up)
            .normalize();

const viewTargetPos = eyeLevelPos.clone().add(
    forward.multiplyScalar(100)
);

     
        }
        updateInspectorStats(selectedObject);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
